apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare-server
  namespace: nonprod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fairshare-server

  template:
    metadata:
      labels:
        app: fairshare-server

    spec:
      containers:
        - name: fairshare-server
          image: ghcr.io/taku10/fairshare-server:latest

          ports:
            - containerPort: 5000

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://mongo:27017/fairshare"