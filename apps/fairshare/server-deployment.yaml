apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare-server
  namespace: nonprod

spec:
  replicas: 1

  selector:
    matchLabels:
      app: fairshare-server

  template:
    metadata:
      labels:
        app: fairshare-server

    spec:
      containers:
        - name: fairshare-server
          image: ghcr.io/Taku10/fairshare-server:1.0.0

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"